[package]
name = "rhythm-units-py"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "rhythm_units"
crate-type = ["cdylib"]

[dependencies]
rhythm_units_rs = { package = "rhythm-units", path = "../.." }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }

# A separate workspace, so the core crate's `cargo test` never links Python.
[workspace]
