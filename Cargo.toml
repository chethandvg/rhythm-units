[package]
name = "rhythm-units"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Period, frequency and bpm conversions, with Lean 4 proofs that speeding time up scales every frequency by the same factor and keeps every ratio."
license = "Apache-2.0"
authors = ["Chethan Dandebala Venkatarama"]
repository = "https://github.com/chethandvg/rhythm-units"
homepage = "https://chethandvg.github.io/frequencies-of-life/repos/rhythm-units/"
readme = "README.md"
keywords = ["rhythm", "frequency", "lean4", "formal-verification", "sonification"]
categories = ["mathematics", "science"]
include = ["/src", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]

[dependencies]

